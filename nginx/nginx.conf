# nginx.conf - Orquestación de tráfico (Strangler Pattern)
# Bifurca las peticiones según la URL:
#   - Rutas antiguas (/api/v1/, /admin/) -> Monolito Django
#   - Ruta estrangulada (/api/v2/pagos/) -> Microservicio Flask

upstream django_web {
    server django_web:8000;
}

upstream flask_pago_service {
    server flask_pago_service:5000;
}

server {
    listen 80;
    server_name localhost;

    # -----------------------------------------------------------------
    # Microservicio NUEVO (estrangulado): Procesamiento de Pagos (Flask)
    # -----------------------------------------------------------------
    location /api/v2/pagos/ {
        proxy_pass http://flask_pago_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------
    # Monolito LEGACY: todo lo demás va a Django
    # (rutas antiguas /api/v1/, /admin/, /api-auth/, etc.)
    # -----------------------------------------------------------------
    location / {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
