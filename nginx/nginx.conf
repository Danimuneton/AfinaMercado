# nginx.conf - API Gateway de AfinaMercado (Strangler Pattern)
#
#   /api/v2/catalogo/  -> Microservicio Flask de Catálogo
#   /api/v2/carrito/   -> Microservicio Flask de Carrito
#   /api/v2/ordenes/   -> Microservicio Flask de Órdenes y Envíos
#   /api/v2/pagos/     -> Microservicio Flask de Pagos
#   /api/v1/, /admin/, / (interfaz web) -> Django (monolito legacy + frontend)

# Límite de peticiones por IP para la API (protege a los microservicios).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

log_format gateway '$remote_addr [$time_local] "$request" $status '
                   'upstream=$upstream_addr tiempo=$request_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log gateway;
    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_types application/json text/css application/javascript;

    add_header X-Content-Type-Options nosniff always;

    # DNS interno de Docker: los nombres se resuelven en cada petición, así
    # Nginx arranca aunque un microservicio esté caído y responde un error
    # controlado en lugar de tumbar todo el gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_web         http://django_web:8000;
    set $catalogo_service   http://flask_catalogo_service:5000;
    set $carrito_service    http://flask_carrito_service:5000;
    set $ordenes_service    http://flask_ordenes_service:5000;
    set $pago_service       http://flask_pago_service:5000;

    # Cabeceras que reciben todos los servicios
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    limit_req_status 429;

    # ---------------------------------------------------------------
    # Microservicios NUEVOS (Flask) - API v2
    # ---------------------------------------------------------------
    location /api/v2/catalogo/ {
        limit_req zone=api burst=40 nodelay;
        error_page 502 503 504 = @microservicio_caido;
        proxy_pass $catalogo_service;
    }

    location /api/v2/carrito/ {
        limit_req zone=api burst=40 nodelay;
        error_page 502 503 504 = @microservicio_caido;
        proxy_pass $carrito_service;
    }

    location /api/v2/ordenes/ {
        limit_req zone=api burst=20 nodelay;
        error_page 502 503 504 = @microservicio_caido;
        proxy_pass $ordenes_service;
    }

    location /api/v2/pagos/ {
        limit_req zone=api burst=20 nodelay;
        error_page 502 503 504 = @microservicio_caido;
        proxy_pass $pago_service;
    }

    # Índice del gateway: qué servicios expone la API v2
    location = /api/v2/ {
        default_type application/json;
        return 200 '{"gateway":"AfinaMercado","version":"v2","servicios":["/api/v2/catalogo/","/api/v2/carrito/","/api/v2/ordenes/","/api/v2/pagos/"],"api_publica":"/api/v2/catalogo/publico/instrumentos"}';
    }

    location /api/v2/ {
        default_type application/json;
        return 404 '{"error":"no_encontrado","detalle":"Ruta no registrada en el API Gateway."}';
    }

    location @microservicio_caido {
        default_type application/json;
        add_header Retry-After 10 always;
        return 503 '{"error":"servicio_no_disponible","detalle":"El microservicio no está disponible en este momento. Intenta de nuevo en unos segundos."}';
    }

    # ---------------------------------------------------------------
    # Monolito LEGACY (Django): /api/v1/, /admin/ e interfaz web
    # ---------------------------------------------------------------
    location / {
        proxy_pass $django_web;
    }
}
