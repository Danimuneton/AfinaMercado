# docker-compose.yml - Ecosistema híbrido de AfinaMercado (Strangler Pattern)
#
#   nginx (API Gateway, único puerto público)
#     ├── django_web             interfaz web + API legacy /api/v1/
#     ├── flask_catalogo_service /api/v2/catalogo/
#     ├── flask_carrito_service  /api/v2/carrito/
#     ├── flask_ordenes_service  /api/v2/ordenes/
#     └── flask_pago_service     /api/v2/pagos/
#   notificaciones_worker (Celery) <── redis (Message Broker)
#   db (PostgreSQL: una base de datos por servicio)
#
# Antes de levantarlo: copiar .env.example a .env y ajustar los valores.

x-flask-env: &flask-env
  SERVICE_TOKEN: ${SERVICE_TOKEN:?Define SERVICE_TOKEN en el archivo .env}

x-flask-healthcheck: &flask-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 15s

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: afinamercado
      POSTGRES_USER: ${POSTGRES_USER:-afinamercado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afinamercado} -d afinamercado"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- Microservicios Flask
  flask_catalogo_service:
    build: ./catalogo_service
    restart: unless-stopped
    environment:
      <<: *flask-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-afinamercado}:${POSTGRES_PASSWORD}@db:5432/catalogo_db
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SEED_DATA: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *flask-healthcheck

  flask_carrito_service:
    build: ./carrito_service
    restart: unless-stopped
    environment:
      <<: *flask-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-afinamercado}:${POSTGRES_PASSWORD}@db:5432/carrito_db
      CATALOGO_URL: http://flask_catalogo_service:5000
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *flask-healthcheck

  flask_ordenes_service:
    build: ./ordenes_service
    restart: unless-stopped
    environment:
      <<: *flask-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-afinamercado}:${POSTGRES_PASSWORD}@db:5432/ordenes_db
      CATALOGO_URL: http://flask_catalogo_service:5000
      CARRITO_URL: http://flask_carrito_service:5000
      PAGO_URL: http://flask_pago_service:5000
      CELERY_BROKER_URL: redis://redis:6379/0
      UMBRAL_ENVIO_ASEGURADO: "5000000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *flask-healthcheck

  flask_pago_service:
    build: ./pago_service
    restart: unless-stopped
    environment:
      <<: *flask-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-afinamercado}:${POSTGRES_PASSWORD}@db:5432/pagos_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *flask-healthcheck

  # ---------------------------------------------------------------- Tareas asíncronas
  notificaciones_worker:
    build: ./notificaciones_service
    restart: unless-stopped
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ORDENES_URL: http://flask_ordenes_service:5000
      ENV_TYPE: ${ENV_TYPE:-DEV}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------- Sistema externo
  # Hace el papel del equipo aliado mientras no haya uno asignado (solo red interna).
  aliado_simulado:
    build: ./aliado_service
    restart: unless-stopped
    healthcheck: *flask-healthcheck

  # ---------------------------------------------------------------- Django
  django_web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en el archivo .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DB_ENGINE: postgres
      DB_NAME: afinamercado
      DB_USER: ${POSTGRES_USER:-afinamercado}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      CATALOGO_URL: http://flask_catalogo_service:5000
      CARRITO_URL: http://flask_carrito_service:5000
      ORDENES_URL: http://flask_ordenes_service:5000
      PAGO_URL: http://flask_pago_service:5000
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DIVISAS_PROVEEDOR: ${DIVISAS_PROVEEDOR:-exchangerate_api}
      # Si .env no define un aliado real, se usa el servicio aliado simulado.
      ALIADO_NOMBRE: ${ALIADO_NOMBRE:-Academia Armonía (servicio aliado simulado)}
      ALIADO_API_URL: ${ALIADO_API_URL:-http://aliado_simulado:5000/api/clases}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---------------------------------------------------------------- API Gateway
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django_web
      - flask_catalogo_service
      - flask_carrito_service
      - flask_ordenes_service
      - flask_pago_service

volumes:
  postgres_data:
  redis_data:
